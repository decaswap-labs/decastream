[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./config/" }]

# Fuzz configuration
fuzz = { runs = 1000, max_local_rejects = 10000, max_global_rejects = 10000 }
fuzz_max_local_rejects = 10000
fuzz_max_global_rejects = 10000


[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true
evm_version = "paris"

[profile.via_ir]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"

[profile.networks.mainnet]
url = "${ETH_RPC_URL}"
accounts = ["${PRIVATE_KEY}"]

[profile.networks.buildbear]
url = "https://rpc.buildbear.io/foolish-darkphoenix-2fe074ec"
accounts = ["${PRIVATE_KEY}"]
chainId = 25875
